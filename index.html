
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b12">
    <meta name="description" content="Modern Dark Video Player">
    <title>My Video Player</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="logo">▶ VIDEO<span>PLAYER</span></div>
</header>

<main class="container">

    <h1>Watch Your Video</h1>
    <p class="subtitle">Enjoy your favorite videos anywhere.</p>

    <div class="video-box">
        <video id="videoPlayer" controls playsinline preload="metadata">
            Browser tidak mendukung pemutar video.
        </video>

        <div id="placeholder" class="placeholder">
            <div class="play-icon">▶</div>
            <p>Video belum tersedia</p>
        </div>
    </div>

    <div class="url-box">
        <label for="videoUrl">Video URL</label>

        <input
            type="url"
            id="videoUrl"
            placeholder="Masukkan link video MP4..."
        >

        <button id="loadButton">PUTAR VIDEO</button>
    </div>

    <div class="info">
        <span>●</span> Player Online
        <span class="quality">HTML5 VIDEO PLAYER</span>
    </div>

</main>

<footer>
    © 2026 My Video Player
</footer>

<script src="script.js"></script>

</body>
</html>
